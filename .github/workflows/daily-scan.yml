name: daily-scan

# Runs after NSE close + bhavcopy publication. NSE closes 15:30 IST; the F&O
# bhavcopy lands by ~18:00 IST. 13:00 UTC = 18:30 IST, Mon–Fri.
# Adjust if NSE shifts publication time.
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write                # needed to commit the day's signal + archive

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        id: scan
        continue-on-error: true    # NSE may block the runner IP; still commit what we have
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.run_scan

      - name: Run backtest over archive
        continue-on-error: true
        run: python -m scripts.run_backtest

      - name: Commit results
        run: |
          git config user.name  "nifty-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "scan: ${{ github.run_id }} ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Flag data failure
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning::Scan reported a data error (NSE may have blocked the runner IP)."
          echo "If this persists, run 'python -m scripts.run_scan' locally and commit."

name: daily-scan

# Scans 3 sessions a day (Mon–Fri). Morning & midday track VIX/NIFTY/ETF live
# (Yahoo) to catch a volatility spike; the evening session does the full option
# scan once the NSE bhavcopy publishes (~18:00 IST). A Telegram alert fires on
# the day's first scan and whenever a strategy flips to ACT. Extra slots per
# session cushion GitHub's best-effort cron. Runs are idempotent.
on:
  schedule:
    - cron: "15 4 * * 1-5"    # ~09:45 IST — morning session
    - cron: "0 7 * * 1-5"     # ~12:30 IST — midday session
    - cron: "15 13 * * 1-5"   # ~18:45 IST — evening session (fresh option data)
    - cron: "0 15 * * 1-5"    # ~20:30 IST — evening backup
  workflow_dispatch:
    inputs:
      force_push:
        description: "Send a Telegram push even if nothing changed (for testing)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        id: scan
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_PUSH: ${{ github.event.inputs.force_push == 'true' && '1' || '' }}
        run: python -m scripts.run_scan

      - name: Run backtest over archive
        continue-on-error: true
        run: python -m scripts.run_backtest

      - name: Commit + push (rebase & retry)
        run: |
          git config user.name  "nifty-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "scan: ${{ github.run_id }} ($(date -u +%Y-%m-%d))"
          # The remote can advance between checkout and push (Pages commits,
          # overlapping runs). Rebase our data commit on top and retry so the
          # push never fails with 'fetch first'.
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected — rebasing on remote (attempt $i)"
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 3
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

      - name: Flag data failure
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::warning::Scan reported a data error (NSE may have blocked the runner IP)."
          echo "If this persists, run 'python -m scripts.run_scan' locally and commit."

name = "nifty-tail-bot"
main = "worker.js"
compatibility_date = "2026-01-01"

# Free open-source LLM via Cloudflare Workers AI — no external API key, no Anthropic.
[ai]
binding = "AI"

[vars]
DATA_BASE_URL = "https://yogeshwaran2002.github.io/nifty-tail-scanner/data"
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GH_REPO = "Yogeshwaran2002/nifty-tail-scanner"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
#   wrangler secret put ALLOWED_CHAT_ID     # optional (lock bot to one chat)
#   wrangler secret put GH_DISPATCH_TOKEN   # optional: fine-grained PAT (Actions RW) for the "Run scan now" button
